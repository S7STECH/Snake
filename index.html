<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>GAME SNAKE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #222;
}

/* العنوان أكبر */
h1 {
    font-family: 'Orbitron', sans-serif;
    color: #00ffcc;
    font-size: 50px;
    text-shadow: 0 0 15px #00ffcc;
    margin-bottom: 20px;
}

/* اللعبة أكبر */
canvas {
    background: #9bbc0f;
    border: 10px solid #2f4f2f;
    box-shadow: 0 0 30px #000 inset;
}

/* أزرار التحكم */
.controls {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 80px 80px 80px;
    gap: 10px;
    justify-content: center;
}

button {
    width: 80px;
    height: 80px;
    font-size: 30px;
    border: none;
    border-radius: 10px;
    background: #00ffcc;
    color: #000;
    font-weight: bold;
}

/* التوقيع */
.signature {
    margin-top: 15px;
    color: #00ffcc;
    font-size: 18px;
}
.signature span {
    color: #fff;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>GAME SNAKE</h1>

<canvas id="game" width="500" height="500"></canvas>

<div class="controls">
    <div></div>
    <button onclick="setDir('UP')">⬆️</button>
    <div></div>

    <button onclick="setDir('LEFT')">⬅️</button>
    <button onclick="setDir('DOWN')">⬇️</button>
    <button onclick="setDir('RIGHT')">➡️</button>
</div>

<div class="signature">
    تصميم <span>حسين بن سعيد</span> | s7s_tec
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 25;

// ثعبان أطول
let snake = [
    {x: 250, y: 250},
    {x: 225, y: 250},
    {x: 200, y: 250}
];

let direction = "RIGHT";

function setDir(dir){
    if (dir === "LEFT" && direction !== "RIGHT") direction = "LEFT";
    if (dir === "UP" && direction !== "DOWN") direction = "UP";
    if (dir === "RIGHT" && direction !== "LEFT") direction = "RIGHT";
    if (dir === "DOWN" && direction !== "UP") direction = "DOWN";
}

// دعم الكيبورد
document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") setDir("LEFT");
    if (e.key === "ArrowUp") setDir("UP");
    if (e.key === "ArrowRight") setDir("RIGHT");
    if (e.key === "ArrowDown") setDir("DOWN");
});

let food = {
    x: Math.floor(Math.random() * 20) * box,
    y: Math.floor(Math.random() * 20) * box
};

function drawSnake() {
    for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? "#0f380f" : "#306230";
        ctx.fillRect(snake[i].x, snake[i].y, box, box);

        ctx.strokeStyle = "#9bbc0f";
        ctx.strokeRect(snake[i].x, snake[i].y, box, box);
    }

    // عيون
    ctx.fillStyle = "#fff";
    ctx.fillRect(snake[0].x + 6, snake[0].y + 6, 4, 4);
    ctx.fillRect(snake[0].x + 15, snake[0].y + 6, 4, 4);
}

function draw() {
    ctx.fillStyle = "#9bbc0f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawSnake();

    // الأكل
    ctx.fillStyle = "#8b0000";
    ctx.fillRect(food.x, food.y, box, box);

    let headX = snake[0].x;
    let headY = snake[0].y;

    if (direction === "LEFT") headX -= box;
    if (direction === "UP") headY -= box;
    if (direction === "RIGHT") headX += box;
    if (direction === "DOWN") headY += box;

    if (headX === food.x && headY === food.y) {
        food = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };
    } else {
        snake.pop();
    }

    let newHead = {x: headX, y: headY};

    if (
        headX < 0 || headY < 0 ||
        headX >= canvas.width || headY >= canvas.height ||
        snake.some((p, i) => i !== 0 && p.x === headX && p.y === headY)
    ) {
        clearInterval(game);
        alert("Game Over 😢");
    }

    snake.unshift(newHead);
}

let game = setInterval(draw, 110);
</script>

</body>
</html>
