<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Snake</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    background:#0a0a0a;
    overflow:hidden;
    touch-action:none;
}

h1 {
    font-family:'Orbitron',sans-serif;
    color:#00ffe5;
    text-shadow:0 0 20px #00ffe5;
}

.score,.highscore,.level {
    color:#fff;
}

canvas {
    background:#9bbc0f;
    border:6px solid #00ffe5;
    box-shadow:0 0 25px #00ffe5;
}

.top-controls {
    margin:10px;
    display:flex;
    gap:10px;
}

.top-controls button {
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#111;
    color:#00ffe5;
}

.controls {
    margin-top:15px;
    display:grid;
    grid-template-columns:80px 80px 80px;
    gap:8px;
}

.controls button {
    height:70px;
    font-size:22px;
    border-radius:12px;
    border:2px solid #00ffe5;
    background:#111;
    color:#00ffe5;
}

.gameover {
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.9);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.gameover h2 {
    font-family:'Orbitron';
    font-size:60px;
    color:#ff004c;
    text-shadow:0 0 20px #ff004c,0 0 60px #ff004c;
}

/* ✨ التوقيع */
.signature {
    margin-top:12px;
    font-family:'Orbitron',sans-serif;
    font-size:14px;
    color:#00ffe5;
    text-shadow:
        0 0 5px #00ffe5,
        0 0 10px #00ffe5,
        0 0 20px #00ffe5;
}
.signature span {
    color:#ffffff;
}
</style>
</head>

<body>

<h1>Snake</h1>

<div class="score">Score: <span id="score">0</span></div>
<div class="highscore">High Score: <span id="highscore">0</span></div>
<div class="level">Level: <span id="level">1</span></div>

<div class="top-controls">
    <button onclick="toggleGame()">⏯ تشغيل</button>
    <button onclick="restartGame()">🔄 إعادة</button>
</div>

<canvas id="game"></canvas>

<div class="controls">
    <div></div>
    <button data-dir="UP">▲</button>
    <div></div>

    <button data-dir="LEFT">◀</button>
    <button data-dir="DOWN">▼</button>
    <button data-dir="RIGHT">▶</button>
</div>

<div class="signature">
تصميم <span>حسين بن سعيد</span> | s7s_tec
</div>

<div class="gameover" id="gameover">
    <h2>GAME OVER</h2>
    <button onclick="restartGame()">RESTART</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const box=25;

/* Responsive */
function resizeCanvas(){
    let size=Math.min(window.innerWidth,window.innerHeight)*0.8;
    size=Math.floor(size/box)*box;
    canvas.width=size;
    canvas.height=size;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

/* Controls */
document.querySelectorAll("[data-dir]").forEach(btn=>{
    btn.addEventListener("pointerdown",e=>{
        setDir(btn.dataset.dir);
        e.preventDefault();
    });
});

/* Swipe */
let sx=0,sy=0;
canvas.addEventListener("touchstart",e=>{
    sx=e.touches[0].clientX;
    sy=e.touches[0].clientY;
});
canvas.addEventListener("touchend",e=>{
    let dx=e.changedTouches[0].clientX-sx;
    let dy=e.changedTouches[0].clientY-sy;

    if(Math.abs(dx)>Math.abs(dy)){
        setDir(dx>0?"RIGHT":"LEFT");
    }else{
        setDir(dy>0?"DOWN":"UP");
    }
});

/* Keyboard */
document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft") setDir("LEFT");
    if(e.key==="ArrowRight") setDir("RIGHT");
    if(e.key==="ArrowUp") setDir("UP");
    if(e.key==="ArrowDown") setDir("DOWN");
});

/* Sound */
function playEatSound(){
    const a=new AudioContext();
    const o=a.createOscillator();
    const g=a.createGain();
    o.frequency.value=650;
    g.gain.value=0.08;
    o.connect(g);
    g.connect(a.destination);
    o.start();
    o.stop(a.currentTime+0.1);
}

/* Data */
let highScore=localStorage.getItem("snakeHighScore")||0;
document.getElementById("highscore").textContent=highScore;

let snake,direction,nextDirection,food,score;
let level=1;
let speed=120;
let running=true;
let animationId=null;
let lastTime=0;

function initGame(){
    snake=[
        {x:250,y:250},
        {x:225,y:250},
        {x:200,y:250}
    ];

    direction="RIGHT";
    nextDirection="RIGHT";
    score=0;
    level=1;
    speed=120;

    document.getElementById("score").textContent=score;
    document.getElementById("level").textContent=level;
    document.getElementById("gameover").style.display="none";

    spawnFood();
}

function spawnFood(){
    let cols=canvas.width/box;
    let rows=canvas.height/box;

    food={
        x:Math.floor(Math.random()*cols)*box,
        y:Math.floor(Math.random()*rows)*box
    };
}

function setDir(dir){
    if(dir==="LEFT"&&direction!=="RIGHT")nextDirection="LEFT";
    if(dir==="RIGHT"&&direction!=="LEFT")nextDirection="RIGHT";
    if(dir==="UP"&&direction!=="DOWN")nextDirection="UP";
    if(dir==="DOWN"&&direction!=="UP")nextDirection="DOWN";
}

function updateLevel(){
    let newLevel=Math.floor(score/5)+1;
    if(newLevel!==level){
        level=newLevel;
        document.getElementById("level").textContent=level;
        speed=Math.max(60,120-level*8);
    }
}

/* Loop ثابت */
function loop(time){
    if(!running) return;

    if(time-lastTime>speed){
        draw();
        lastTime=time;
    }

    animationId=requestAnimationFrame(loop);
}

function start(){
    if(animationId) cancelAnimationFrame(animationId);
    animationId=requestAnimationFrame(loop);
}

/* 🔥 رسم مطور */
function draw(){
    direction=nextDirection;

    ctx.fillStyle="#9bbc0f";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    /* 🍎 أكل نيون مطور */
    ctx.save();
    ctx.shadowBlur=20;
    ctx.shadowColor="#ff003c";
    ctx.fillStyle="#ff003c";
    ctx.beginPath();
    ctx.arc(food.x+box/2,food.y+box/2,box/2.2,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    let headX=snake[0].x;
    let headY=snake[0].y;

    if(direction==="LEFT")headX-=box;
    if(direction==="RIGHT")headX+=box;
    if(direction==="UP")headY-=box;
    if(direction==="DOWN")headY+=box;

    if(headX<0||headY<0||headX>=canvas.width||headY>=canvas.height||
       snake.some((p,i)=>i!==0&&p.x===headX&&p.y===headY)){
        running=false;
        cancelAnimationFrame(animationId);
        document.getElementById("gameover").style.display="flex";
        return;
    }

    if(headX===food.x&&headY===food.y){
        score++;
        document.getElementById("score").textContent=score;
        playEatSound();
        spawnFood();

        if(score>highScore){
            highScore=score;
            localStorage.setItem("snakeHighScore",highScore);
            document.getElementById("highscore").textContent=highScore;
        }

        updateLevel();
    }else{
        snake.pop();
    }

    snake.unshift({x:headX,y:headY});

    /* 🐍 ثعبان مطور (Gradient + Glow) */
    snake.forEach((p,i)=>{
        ctx.save();

        ctx.shadowBlur=15;
        ctx.shadowColor="#00ffe5";

        let grad=ctx.createLinearGradient(p.x,p.y,p.x+box,p.y+box);
        grad.addColorStop(0,"#00ffe5");
        grad.addColorStop(1,"#007a66");

        ctx.fillStyle=i===0?grad:"#007a66";

        ctx.beginPath();
        ctx.roundRect(p.x,p.y,box,box,6);
        ctx.fill();

        ctx.restore();

        /* 👀 عيون الرأس */
        if(i===0){
            ctx.fillStyle="#fff";
            ctx.fillRect(p.x+6,p.y+6,4,4);
            ctx.fillRect(p.x+14,p.y+6,4,4);
        }
    });
}

function toggleGame(){
    running=!running;
    if(running) start();
}

function restartGame(){
    cancelAnimationFrame(animationId);
    initGame();
    running=true;
    start();
}

initGame();
start();
</script>

</body>
</html>
