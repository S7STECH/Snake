<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>GAME SNAKE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #0a0a0a;
}

h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 50px;
    color: #00ffe5;
    text-shadow: 0 0 20px #00ffe5;
}

.score, .highscore {
    color: #fff;
    font-size: 18px;
}

canvas {
    background: #9bbc0f;
    border: 6px solid #00ffe5;
    box-shadow: 0 0 25px #00ffe5;
}

.top-controls {
    margin: 10px 0;
    display: flex;
    gap: 10px;
}

.top-controls button {
    width: 140px;
    height: 45px;
    border: none;
    border-radius: 12px;
    background: #111;
    color: #00ffe5;
    box-shadow: 0 0 12px #00ffe5;
    font-weight: bold;
}

.controls {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 90px 90px 90px;
    gap: 10px;
}

.controls button {
    height: 85px;
    font-size: 28px;
    border-radius: 15px;
    border: 2px solid #00ffe5;
    background: #111;
    color: #00ffe5;
    box-shadow: 0 0 12px #00ffe5;
    touch-action: manipulation;
}

.signature {
    margin-top: 15px;
    color: #00ffe5;
}
</style>
</head>

<body>

<h1>🐍 SNAKE NEON</h1>

<div class="score">Score: <span id="score">0</span></div>
<div class="highscore">High Score: <span id="highscore">0</span></div>

<div class="top-controls">
    <button onclick="toggleGame()">⏯ تشغيل</button>
    <button onclick="restartGame()">🔄 إعادة</button>
</div>

<canvas id="game" width="500" height="500"></canvas>

<div class="controls">
    <div></div>
    <button data-dir="UP">▲</button>
    <div></div>

    <button data-dir="LEFT">◀</button>
    <button data-dir="DOWN">▼</button>
    <button data-dir="RIGHT">▶</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const box = 25;

/* تحكم سريع */
document.querySelectorAll("[data-dir]").forEach(btn => {
    btn.addEventListener("pointerdown", (e) => {
        setDir(btn.dataset.dir);
        e.preventDefault();
    });
});

/* صوت الأكل */
function playEatSound(){
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "square";
    osc.frequency.value = 600;
    gain.gain.value = 0.1;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

/* High score */
let highScore = localStorage.getItem("snakeHighScore") || 0;
document.getElementById("highscore").textContent = highScore;

let snake, direction, nextDirection, score, food;
let game = null;
let running = false;

function initGame(){
    snake = [
        {x: 250, y: 250},
        {x: 225, y: 250},
        {x: 200, y: 250}
    ];

    direction = "RIGHT";
    nextDirection = "RIGHT";
    score = 0;

    document.getElementById("score").textContent = score;

    food = {
        x: Math.floor(Math.random() * 20) * box,
        y: Math.floor(Math.random() * 20) * box
    };
}

function setDir(dir){
    if (dir === "LEFT" && direction !== "RIGHT") nextDirection = "LEFT";
    if (dir === "UP" && direction !== "DOWN") nextDirection = "UP";
    if (dir === "RIGHT" && direction !== "LEFT") nextDirection = "RIGHT";
    if (dir === "DOWN" && direction !== "UP") nextDirection = "DOWN";
}

function draw(){
    direction = nextDirection;

    ctx.fillStyle = "#9bbc0f";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#8b0000";
    ctx.fillRect(food.x, food.y, box, box);

    let headX = snake[0].x;
    let headY = snake[0].y;

    if (direction === "LEFT") headX -= box;
    if (direction === "UP") headY -= box;
    if (direction === "RIGHT") headX += box;
    if (direction === "DOWN") headY += box;

    let hitWall =
        headX < 0 || headY < 0 ||
        headX > canvas.width - box ||
        headY > canvas.height - box;

    let hitSelf = snake.some((p,i)=>i!==0 && p.x===headX && p.y===headY);

    if (hitWall || hitSelf) {
        clearInterval(game);
        running = false;
        alert("Game Over 😢");
        return;
    }

    if (headX === food.x && headY === food.y) {
        score++;
        document.getElementById("score").textContent = score;

        playEatSound();

        food = {
            x: Math.floor(Math.random()*20)*box,
            y: Math.floor(Math.random()*20)*box
        };

        if (score > highScore) {
            highScore = score;
            localStorage.setItem("snakeHighScore", highScore);
            document.getElementById("highscore").textContent = highScore;
        }
    } else {
        snake.pop();
    }

    snake.unshift({x: headX, y: headY});

    /* 🐍 رسم الثعبان بشكل أجمل */
    snake.forEach((p,i)=>{
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, box, box, 6);

        ctx.fillStyle = i === 0 ? "#00ffe5" : "#007a66";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#00ffe5";
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#003d33";
        ctx.stroke();
    });
}

/* تشغيل / إيقاف */
function toggleGame(){
    if (running) {
        clearInterval(game);
        running = false;
    } else {
        game = setInterval(draw, 120); // ⏱ أبطأ وأريح
        running = true;
    }
}

/* إعادة */
function restartGame(){
    clearInterval(game);
    running = false;
    initGame();
    game = setInterval(draw, 120);
    running = true;
}

initGame();
game = setInterval(draw, 120);
running = true;

</script>

</body>
</html>
