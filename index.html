<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>GAME SNAKE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #0a0a0a;
    overflow: hidden;
}

/* العنوان */
h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 50px;
    color: #00ffe5;
    text-shadow: 0 0 15px #00ffe5, 0 0 30px #00ffe5;
    margin-bottom: 5px;
}

/* السكور */
.score, .highscore {
    color: #fff;
    font-size: 18px;
}

/* الكانفس */
canvas {
    background: #9bbc0f;
    border: 6px solid #00ffe5;
    box-shadow: 0 0 25px #00ffe5;
    margin-top: 10px;
}

/* ================== أزرار التحكم العلوية ================== */
.top-controls {
    margin: 10px 0;
    display: flex;
    gap: 10px;
}

.top-controls button {
    width: 140px;
    height: 45px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    color: #00ffe5;
    background: #111;
    box-shadow: 0 0 10px #00ffe5;
    cursor: pointer;
}

.top-controls button:active {
    transform: scale(0.95);
}

/* ================== الأسهم ================== */
.controls {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 90px 90px 90px;
    gap: 10px;
}

.controls button {
    height: 85px;
    font-size: 28px;
    border-radius: 15px;
    border: 2px solid #00ffe5;
    background: #111;
    color: #00ffe5;
    box-shadow: 0 0 12px #00ffe5;
}

/* التوقيع */
.signature {
    margin-top: 15px;
    color: #00ffe5;
}
.signature span {
    color: #fff;
}
</style>
</head>

<body>

<h1>🐍 SNAKE NEON</h1>

<div class="score">Score: <span id="score">0</span></div>
<div class="highscore">High Score: <span id="highscore">0</span></div>

<!-- أزرار التحكم الجديدة (بعيدة) -->
<div class="top-controls">
    <button onclick="toggleGame()">⏯ تشغيل</button>
    <button onclick="restartGame()">🔄 إعادة</button>
</div>

<canvas id="game" width="500" height="500"></canvas>

<!-- الأسهم -->
<div class="controls">
    <div></div>
    <button onclick="setDir('UP')">▲</button>
    <div></div>

    <button onclick="setDir('LEFT')">◀</button>
    <button onclick="setDir('DOWN')">▼</button>
    <button onclick="setDir('RIGHT')">▶</button>
</div>

<div class="signature">
    تصميم <span>حسين بن سعيد</span> | s7s_tec
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const box = 25;

/* صوت الأكل */
function playEatSound(){
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "square";
    osc.frequency.value = 600;

    gain.gain.value = 0.1;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

/* High Score */
let highScore = localStorage.getItem("snakeHighScore") || 0;
document.getElementById("highscore").textContent = highScore;

let snake, direction, nextDirection, score, food;
let game = null;
let running = false;

function initGame(){
    snake = [
        {x: 250, y: 250},
        {x: 225, y: 250},
        {x: 200, y: 250}
    ];

    direction = "RIGHT";
    nextDirection = "RIGHT";
    score = 0;

    document.getElementById("score").textContent = score;

    food = {
        x: Math.floor(Math.random() * 20) * box,
        y: Math.floor(Math.random() * 20) * box
    };
}

function setDir(dir){
    if (dir === "LEFT" && direction !== "RIGHT") nextDirection = "LEFT";
    if (dir === "UP" && direction !== "DOWN") nextDirection = "UP";
    if (dir === "RIGHT" && direction !== "LEFT") nextDirection = "RIGHT";
    if (dir === "DOWN" && direction !== "UP") nextDirection = "DOWN";
}

/* اللعبة */
function draw(){

    direction = nextDirection;

    ctx.fillStyle = "#9bbc0f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#8b0000";
    ctx.fillRect(food.x, food.y, box, box);

    let headX = snake[0].x;
    let headY = snake[0].y;

    if (direction === "LEFT") headX -= box;
    if (direction === "UP") headY -= box;
    if (direction === "RIGHT") headX += box;
    if (direction === "DOWN") headY += box;

    let hitWall =
        headX < 0 || headY < 0 ||
        headX > canvas.width - box ||
        headY > canvas.height - box;

    let hitSelf = snake.some((p, i) => i !== 0 && p.x === headX && p.y === headY);

    if (hitWall || hitSelf) {
        clearInterval(game);
        running = false;
        alert("Game Over 😢");
        return;
    }

    if (headX === food.x && headY === food.y) {
        score++;
        document.getElementById("score").textContent = score;

        playEatSound();

        food = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };

        if (score > highScore) {
            highScore = score;
            localStorage.setItem("snakeHighScore", highScore);
            document.getElementById("highscore").textContent = highScore;
        }
    } else {
        snake.pop();
    }

    snake.unshift({x: headX, y: headY});

    snake.forEach((p, i) => {
        ctx.fillStyle = i === 0 ? "#0f380f" : "#306230";
        ctx.fillRect(p.x, p.y, box, box);
    });
}

/* تشغيل / إيقاف */
function toggleGame(){
    if (running) {
        clearInterval(game);
        running = false;
    } else {
        game = setInterval(draw, 100);
        running = true;
    }
}

/* إعادة */
function restartGame(){
    clearInterval(game);
    running = false;
    initGame();
    game = setInterval(draw, 100);
    running = true;
}

/* بدء */
initGame();
game = setInterval(draw, 100);
running = true;

</script>

</body>
</html>
