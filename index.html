<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>GAME SNAKE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #111;
}

h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 50px;
    color: #00ffcc;
    text-shadow: 0 0 20px #00ffcc;
}

.score {
    color: #fff;
    margin-bottom: 5px;
    font-size: 20px;
}

.highscore {
    color: gold;
    margin-bottom: 10px;
    font-size: 18px;
}

canvas {
    background: #9bbc0f;
    border: 10px solid #2f4f2f;
}

.controls {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 90px 90px 90px;
    gap: 10px;
}

button {
    height: 90px;
    font-size: 30px;
    border-radius: 10px;
    border: none;
    background: #00ffcc;
}

.game-buttons {
    margin-top: 15px;
    display: flex;
    gap: 10px;
}

.game-buttons button {
    height: 50px;
    font-size: 16px;
    padding: 10px 15px;
}

.signature {
    margin-top: 15px;
    color: #00ffcc;
}
.signature span {
    color: #fff;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>GAME SNAKE</h1>

<div class="score">Score: <span id="score">0</span></div>
<div class="highscore">High Score: <span id="highscore">0</span></div>

<canvas id="game" width="500" height="500"></canvas>

<div class="controls">
    <div></div>
    <button ontouchstart="setDir('UP')" onclick="setDir('UP')">⬆️</button>
    <div></div>

    <button ontouchstart="setDir('LEFT')" onclick="setDir('LEFT')">⬅️</button>
    <button ontouchstart="setDir('DOWN')" onclick="setDir('DOWN')">⬇️</button>
    <button ontouchstart="setDir('RIGHT')" onclick="setDir('RIGHT')">➡️</button>
</div>

<div class="game-buttons">
    <button onclick="toggleGame()">⏯ تشغيل / إيقاف</button>
    <button onclick="restartGame()">🔄 إعادة</button>
</div>

<div class="signature">
    تصميم <span>حسين بن سعيد</span> | s7s_tec
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const box = 25;

/* صوت الأكل (بدون ملف خارجي) */
function playEatSound(){
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "square";
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

/* أعلى نتيجة */
let highScore = localStorage.getItem("snakeHighScore") || 0;
document.getElementById("highscore").textContent = highScore;

let snake, direction, nextDirection, score, food;
let game = null;
let running = false;

function initGame(){
    snake = [
        {x: 250, y: 250},
        {x: 225, y: 250},
        {x: 200, y: 250}
    ];

    direction = "RIGHT";
    nextDirection = "RIGHT";
    score = 0;

    document.getElementById("score").textContent = score;

    food = {
        x: Math.floor(Math.random() * 20) * box,
        y: Math.floor(Math.random() * 20) * box
    };
}

function setDir(dir){
    if (dir === "LEFT" && direction !== "RIGHT") nextDirection = "LEFT";
    if (dir === "UP" && direction !== "DOWN") nextDirection = "UP";
    if (dir === "RIGHT" && direction !== "LEFT") nextDirection = "RIGHT";
    if (dir === "DOWN" && direction !== "UP") nextDirection = "DOWN";
}

document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") setDir("LEFT");
    if (e.key === "ArrowUp") setDir("UP");
    if (e.key === "ArrowRight") setDir("RIGHT");
    if (e.key === "ArrowDown") setDir("DOWN");
});

function drawSnake(){
    snake.forEach((part, i) => {
        ctx.fillStyle = i === 0 ? "#0f380f" : "#306230";
        ctx.fillRect(part.x, part.y, box, box);

        ctx.strokeStyle = "#9bbc0f";
        ctx.strokeRect(part.x, part.y, box, box);
    });
}

function draw(){
    direction = nextDirection;

    ctx.fillStyle = "#9bbc0f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawSnake();

    ctx.fillStyle = "#8b0000";
    ctx.fillRect(food.x, food.y, box, box);

    let headX = snake[0].x;
    let headY = snake[0].y;

    if (direction === "LEFT") headX -= box;
    if (direction === "UP") headY -= box;
    if (direction === "RIGHT") headX += box;
    if (direction === "DOWN") headY += box;

    /* الأكل */
    if (headX === food.x && headY === food.y) {
        score++;
        document.getElementById("score").textContent = score;

        playEatSound(); // 🔊 صوت الأكل

        food = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };

        /* تحديث أعلى نتيجة */
        if (score > highScore) {
            highScore = score;
            localStorage.setItem("snakeHighScore", highScore);
            document.getElementById("highscore").textContent = highScore;
        }

    } else {
        snake.pop();
    }

    let newHead = {x: headX, y: headY};

    if (
        headX < 0 || headY < 0 ||
        headX >= canvas.width || headY >= canvas.height ||
        snake.some((p, i) => i !== 0 && p.x === headX && p.y === headY)
    ) {
        clearInterval(game);
        running = false;
        alert("Game Over 😢");
    }

    snake.unshift(newHead);
}

/* تشغيل / إيقاف */
function toggleGame(){
    if (running) {
        clearInterval(game);
        running = false;
    } else {
        game = setInterval(draw, 100);
        running = true;
    }
}

/* إعادة تشغيل */
function restartGame(){
    clearInterval(game);
    running = false;
    initGame();
    game = setInterval(draw, 100);
    running = true;
}

/* بدء اللعبة */
initGame();
game = setInterval(draw, 100);
running = true;

</script>

</body>
</html>
