<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>GAME SNAKE</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #222;
}

/* عنوان */
h1 {
    font-family: 'Orbitron', sans-serif;
    color: #00ffcc;
    text-shadow: 0 0 10px #00ffcc;
    margin-bottom: 10px;
}

/* شاشة مثل نوكيا */
canvas {
    background: #9bbc0f;
    border: 8px solid #2f4f2f;
    box-shadow: 0 0 20px #000 inset;
}

/* توقيع */
.signature {
    margin-top: 10px;
    color: #00ffcc;
    font-size: 14px;
    opacity: 0.8;
}
.signature span {
    color: #fff;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>GAME SNAKE</h1>

<canvas id="game" width="400" height="400"></canvas>

<div class="signature">
    تصميم <span>حسين بن سعيد</span> | s7s_tec
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;

// الثعبان (أكثر من جزء من البداية)
let snake = [
    {x: 200, y: 200},
    {x: 180, y: 200},
    {x: 160, y: 200}
];

let direction = "RIGHT";

let food = {
    x: Math.floor(Math.random() * 20) * box,
    y: Math.floor(Math.random() * 20) * box
};

document.addEventListener("keydown", changeDirection);

function changeDirection(e) {
    if (e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
    if (e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
    if (e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
    if (e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
}

function drawSnake() {
    for (let i = 0; i < snake.length; i++) {

        // الرأس
        if (i === 0) {
            ctx.fillStyle = "#0f380f"; // غامق
        } else {
            ctx.fillStyle = "#306230"; // جسم
        }

        ctx.fillRect(snake[i].x, snake[i].y, box, box);

        // حواف ناعمة (تخليها أقرب لثعبان)
        ctx.strokeStyle = "#9bbc0f";
        ctx.strokeRect(snake[i].x, snake[i].y, box, box);
    }

    // عيون الرأس 😎
    ctx.fillStyle = "#fff";
    ctx.fillRect(snake[0].x + 5, snake[0].y + 5, 3, 3);
    ctx.fillRect(snake[0].x + 12, snake[0].y + 5, 3, 3);
}

function draw() {
    ctx.fillStyle = "#9bbc0f";
    ctx.fillRect(0, 0, 400, 400);

    drawSnake();

    // الأكل
    ctx.fillStyle = "#8b0000";
    ctx.fillRect(food.x, food.y, box, box);

    let headX = snake[0].x;
    let headY = snake[0].y;

    if (direction === "LEFT") headX -= box;
    if (direction === "UP") headY -= box;
    if (direction === "RIGHT") headX += box;
    if (direction === "DOWN") headY += box;

    // أكل
    if (headX === food.x && headY === food.y) {
        food = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };
    } else {
        snake.pop();
    }

    let newHead = {x: headX, y: headY};

    // اصطدام
    if (
        headX < 0 || headY < 0 ||
        headX >= 400 || headY >= 400 ||
        snake.some((part, index) => index !== 0 && part.x === headX && part.y === headY)
    ) {
        clearInterval(game);
        alert("Game Over 😢");
    }

    snake.unshift(newHead);
}

let game = setInterval(draw, 120);
</script>

</body>
</html>
