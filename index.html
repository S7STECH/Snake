<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SNAKE NEON</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    background:#0a0a0a;
    overflow:hidden;
    touch-action:none;
}

h1 {
    font-family:'Orbitron',sans-serif;
    color:#00ffe5;
    text-shadow:0 0 20px #00ffe5;
}

canvas {
    border:5px solid #00ffe5;
    box-shadow:0 0 20px #00ffe5;
    background:#9bbc0f;
}

/* الأسهم */
.controls {
    margin-top:15px;
    display:grid;
    grid-template-columns:80px 80px 80px;
    gap:8px;
}

.controls button {
    height:70px;
    font-size:22px;
    border-radius:12px;
    border:2px solid #00ffe5;
    background:#111;
    color:#00ffe5;
    touch-action:manipulation;
}

/* Game Over */
.gameover {
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.9);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.gameover h2 {
    font-family:'Orbitron';
    font-size:50px;
    color:#ff004c;
    text-shadow:0 0 20px #ff004c,0 0 60px #ff004c;
}

.gameover button {
    margin-top:20px;
    padding:10px 25px;
    border:none;
    background:#00ffe5;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>SNAKE NEON</h1>

<canvas id="game"></canvas>

<div class="controls">
    <div></div>
    <button data-dir="UP">▲</button>
    <div></div>

    <button data-dir="LEFT">◀</button>
    <button data-dir="DOWN">▼</button>
    <button data-dir="RIGHT">▶</button>
</div>

<div class="gameover" id="gameover">
    <h2>GAME OVER</h2>
    <button onclick="restartGame()">RESTART</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

/* 🔥 مقاس ديناميكي */
function resizeCanvas(){
    let size=Math.min(window.innerWidth, window.innerHeight)*0.8;
    canvas.width=size;
    canvas.height=size;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

const box=25;

let snake,direction,nextDirection,food;
let game=null;

/* 🔥 دعم الأزرار */
document.querySelectorAll("[data-dir]").forEach(btn=>{
    btn.addEventListener("pointerdown",e=>{
        setDir(btn.dataset.dir);
        e.preventDefault();
    });
});

/* 🔥 دعم السحب (Swipe) */
let startX=0,startY=0;

canvas.addEventListener("touchstart",e=>{
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
});

canvas.addEventListener("touchend",e=>{
    let dx=e.changedTouches[0].clientX-startX;
    let dy=e.changedTouches[0].clientY-startY;

    if(Math.abs(dx)>Math.abs(dy)){
        if(dx>0) setDir("RIGHT");
        else setDir("LEFT");
    }else{
        if(dy>0) setDir("DOWN");
        else setDir("UP");
    }
});

/* 🔥 كيبورد */
document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft") setDir("LEFT");
    if(e.key==="ArrowRight") setDir("RIGHT");
    if(e.key==="ArrowUp") setDir("UP");
    if(e.key==="ArrowDown") setDir("DOWN");
});

function initGame(){
    snake=[
        {x:200,y:200},
        {x:175,y:200},
        {x:150,y:200}
    ];
    direction="RIGHT";
    nextDirection="RIGHT";

    food={
        x:Math.floor(Math.random()*10)*box,
        y:Math.floor(Math.random()*10)*box
    };

    document.getElementById("gameover").style.display="none";
}

function setDir(dir){
    if(dir==="LEFT"&&direction!=="RIGHT")nextDirection="LEFT";
    if(dir==="RIGHT"&&direction!=="LEFT")nextDirection="RIGHT";
    if(dir==="UP"&&direction!=="DOWN")nextDirection="UP";
    if(dir==="DOWN"&&direction!=="UP")nextDirection="DOWN";
}

function draw(){
    direction=nextDirection;

    ctx.fillStyle="#9bbc0f";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="red";
    ctx.fillRect(food.x,food.y,box,box);

    let headX=snake[0].x;
    let headY=snake[0].y;

    if(direction==="LEFT")headX-=box;
    if(direction==="RIGHT")headX+=box;
    if(direction==="UP")headY-=box;
    if(direction==="DOWN")headY+=box;

    if(
        headX<0||headY<0||
        headX>canvas.width-box||
        headY>canvas.height-box
    ){
        clearInterval(game);
        document.getElementById("gameover").style.display="flex";
        return;
    }

    if(headX===food.x&&headY===food.y){
        food={
            x:Math.floor(Math.random()*10)*box,
            y:Math.floor(Math.random()*10)*box
        };
    }else{
        snake.pop();
    }

    snake.unshift({x:headX,y:headY});

    snake.forEach(p=>{
        ctx.fillStyle="#00ffe5";
        ctx.fillRect(p.x,p.y,box,box);
    });
}

function restartGame(){
    clearInterval(game);
    initGame();
    game=setInterval(draw,120);
}

initGame();
game=setInterval(draw,120);

</script>

</body>
</html>
